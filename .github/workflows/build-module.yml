name: Build AmneziaWG APK (ZTE MF286D - Fixed Vermagic)

on:
  workflow_dispatch:

jobs:
  build:
    name: "OpenWrt SNAPSHOT - ipq40xx/generic"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: 9495b6e74a  # <--- DOKŁADNY HASH Z TWOJEGO BUILD ID (r33141-9495b6e74a)
          fetch-depth: 0

      - name: Cache OpenWrt build tools & downloads
        uses: actions/cache@v4
        with:
          path: |
            dl
            staging_dir/host
          key: openwrt-ipq40xx-${{ hashFiles('include/kernel*') }}
          restore-keys: |
            openwrt-ipq40xx-

      - name: Building kernel and tools
        run: |
          # Pobranie konfiguracji i feedów pasujących do snapshotu
          wget https://downloads.openwrt.org/snapshots/targets/ipq40xx/generic/feeds.buildinfo -O feeds.conf
          echo "src-git awgopenwrt https://github.com/yury-sannikov/awg-openwrt.git" >> ./feeds.conf
          ./scripts/feeds update && ./scripts/feeds install -a

          # Pobranie oficjalnego configu buildu
          wget https://downloads.openwrt.org/snapshots/targets/ipq40xx/generic/config.buildinfo -O .config
          
          # Włączenie pakietów AmneziaWG jako modułów (m) i narzędzi (y)
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-amneziawg=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20=m" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=m" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=m" >> .config

          make defconfig

          # Budowanie narzędzi, toolchaina i jądra
          make tools/install -i -j `nproc`
          make toolchain/install -i -j `nproc`
          make target/linux/compile -i -j `nproc` V=s

      - name: Inject exact router vermagic
        run: |
          TARGET_VERMAGIC="5720c378674d36ddf4f2ee5282ab38bd"
          find build_dir/ -name ".vermagic" -exec sh -c 'echo "$1" > "$2"' _ "$TARGET_VERMAGIC" {} \;
          echo "Ustawiono vermagic na: $TARGET_VERMAGIC"

      - name: Build AmneziaWG packages
        run: |
          # Czysta kompilacja modułu jądra, narzędzi oraz interfejsu LuCI
          make package/kmod-amneziawg/compile V=s
          make package/amneziawg-tools/compile V=s
          make package/luci-app-amneziawg/compile V=s

      - name: Prepare artifacts
        run: |
          mkdir -p awgrelease
          # Ponieważ OpenWrt 25.12 korzysta z apk, wyciągamy gotowe pakiety apk
          find bin/ -name "*amneziawg*.apk" -exec cp {} awgrelease/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-zte-mf286d-exact-vermagic
          path: awgrelease/*
